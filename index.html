<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="description" content="Control de capitales, gastos y recuperaciones.">
<link rel="manifest" href="manifest.json">
<title>CONTROL DE CAPITAL</title>
<style>
:root{--bg:#0d0e11;--panel:#17191e;--panel2:#20232a;--line:#2b2e36;--text:#f4f5f7;--muted:#9ba1ad;--green:#24b574;--red:#ff6b70;--yellow:#f3bd54;--blue:#72a7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:13px 15px;font-weight:700}
.app{max-width:760px;margin:auto;padding:18px 15px 90px}.top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 20px}.brand{font-size:20px;font-weight:900;letter-spacing:.4px}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.iconbtn{background:var(--panel2);color:var(--text);padding:10px 12px}
h2{font-size:17px;margin:24px 0 12px}h3{font-size:15px;margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--panel2);padding:13px;border-radius:13px}.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.stat strong{font-size:17px}
.big{font-size:30px;font-weight:850;letter-spacing:-.8px;margin:8px 0}.muted{color:var(--muted)}.small{font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.primary{background:var(--green);color:#07150f}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.danger{background:#482326;color:#ffb7ba}.warning{color:var(--yellow)}.positive{color:var(--green)}.negative{color:var(--red)}
.capital{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:16px;border-radius:16px;margin:7px 0}
.capital:active,button:active{opacity:.8}.pill{font-size:10px;border-radius:20px;padding:5px 8px;background:#26372f;color:#8be0b4}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
input,select,textarea{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:#101216;color:var(--text);outline:none}
textarea{min-height:75px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#14161a;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));z-index:5}
.nav button{background:transparent;color:var(--muted);font-size:11px;padding:8px 5px;flex:1}.nav button.active{color:var(--green)}
.hidden{display:none!important}.movement{padding:12px 0;border-bottom:1px solid var(--line)}.movement:last-child{border:0}
.tag{font-size:10px;padding:4px 7px;border-radius:7px;background:#282b32;color:#c4c8d0}.bar{height:9px;background:#30343c;border-radius:9px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:var(--green)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
.sheethead{display:flex;justify-content:space-between;align-items:center}.close{background:var(--panel2);color:white;padding:8px 11px}.notice{padding:11px;border-radius:11px;background:#252a32;color:#c5cad3;font-size:12px;line-height:1.5}

.brandlock{display:flex;align-items:center;gap:10px;min-width:0}
.brandlock img{width:54px;height:54px;object-fit:cover;border-radius:13px}
.brandtext{min-width:0}.brand span{color:#20c997}
.welcome{font-size:22px;font-weight:800;margin:22px 0 4px}
.hero{background:linear-gradient(135deg,#073d32,#10251f 75%);border:1px solid #167c61;border-radius:18px;padding:17px;margin:16px 0}
.hero-label{font-size:12px;color:#b9d9cf}.hero-value{font-size:27px;font-weight:850;margin:6px 0 2px}
.hero-note{font-size:11px;color:#9fd9c4}
.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.quick{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;text-align:left;color:var(--text);min-height:88px}
.quick .qicon{font-size:21px;color:#20c997;margin-bottom:8px}
.quick strong{display:block;font-size:14px}.quick small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.home-create{width:100%;margin:8px 0 15px;background:#18b981;color:#04160f}
.currencyline{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:9px;color:#c8d5d1}

.hero{background:linear-gradient(135deg,#073e33 0%,#102923 55%,#101a1c 100%);border:1px solid #168b6b;border-radius:19px;padding:18px;margin:18px 0 14px;box-shadow:inset 0 1px 0 #ffffff12}
.hero-label{font-size:11px;letter-spacing:1.1px;font-weight:800;color:#b7d8cf}
.hero-value{font-size:29px;font-weight:850;letter-spacing:-.6px;margin:9px 0 0;color:#f4fffb}
.hero-usd{font-size:23px;margin-top:6px}
.hero-sub{font-size:11px;color:#a6c8bd;margin-top:1px}
.hero-divider{height:1px;background:#ffffff22;margin:11px 0 4px}
.hero-note{font-size:10px;color:#a6c8bd;margin-top:12px;line-height:1.45}
.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.quick{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:94px;background:linear-gradient(145deg,#171c20,#111519);border:1px solid #303940;border-radius:15px;padding:13px 14px;text-align:left;color:var(--text)}
.quick .qicon{font-size:23px;line-height:1;color:#20c997;margin-bottom:8px}
.quick strong{font-size:14px}.quick small{font-size:10px;color:#a6adb7;margin-top:3px}
.home-create{width:100%;margin:4px 0 12px;background:#19b981;color:#04150f;border-radius:13px;padding:15px}
.empty-state{padding:20px;text-align:center}
.empty-mark{font-size:28px;color:#20c997;margin-bottom:8px}
.empty-state p{color:var(--muted);font-size:12px;line-height:1.5}

@media(max-width:390px){.brandlock img{width:46px;height:46px}.brand{font-size:17px}.welcome{font-size:20px}.hero-value{font-size:24px}}

@media(min-width:600px){.app{padding-top:28px}.modal{align-items:center}.sheet{border-radius:22px;max-height:85vh}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div><div class="brandlock"><img src="logo-principal.jpg" alt="Logo oficial de CONTROL DE CAPITAL"><div class="brandtext"><div class="brand">CONTROL DE <span>CAPITAL</span></div><div class="sub">Tus movimientos, siempre bajo control</div></div></div></div>
 <button class="iconbtn" onclick="openSettings()" aria-label="Configuración">⚙</button>
</header>
<main id="view"></main>
</div>
<nav class="nav">
 <button data-tab="home" class="active" onclick="go('home')">⌂<br>Inicio</button>
 <button data-tab="movements" onclick="go('movements')">⇅<br>Movimientos</button>
 <button data-tab="reports" onclick="go('reports')">▥<br>Reportes</button>
 <button data-tab="history" onclick="go('history')">◷<br>Historial</button>
</nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='controlCapital_v1';
const defaults=['Alimentación','Transporte','Compras','Servicios','Materiales','Salud','Educación','Mantenimiento','Otros'];
let db=load(),tab='home',selected=null,reportMonth=new Date().toISOString().slice(0,7),reportYear=String(new Date().getFullYear());
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{capitals:[],categories:defaults,events:[]}}catch(e){return {capitals:[],categories:defaults,events:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(n,c){return (c==='USD'?'$ ':'C$ ')+Number(n||0).toLocaleString('es-NI',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dateNow(){return new Date().toISOString().slice(0,10)}
function cap(idv){return db.capitals.find(x=>x.id===idv)}
function eventsFor(cid){return db.events.filter(e=>e.capitalId===cid)}
function validEvents(cid){return eventsFor(cid).filter(e=>!e.voided&&!e.deleted)}
function totals(cid){
 let es=validEvents(cid), c=cap(cid), initial=Number(c.initial), additions=0,spent=0,receivable=0,recovered=0;
 es.forEach(e=>{let a=Number(e.amount)||0;if(e.type==='addition')additions+=a;if(e.type==='expense')spent+=a;if(e.type==='recoverable')receivable+=a;if(e.type==='recovery')recovered+=a});
 let pending= Math.max(0,receivable-recovered);
 return {initial,additions,base:initial+additions,spent,receivable,recovered,pending,balance:initial+additions-spent-receivable+recovered};
}
function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('es-NI',{day:'2-digit',month:'short',year:'numeric'})}
function go(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function render(){let v=document.getElementById('view');if(tab==='home')v.innerHTML=home();if(tab==='movements')v.innerHTML=movementPage();if(tab==='reports')v.innerHTML=reportsPage();if(tab==='history')v.innerHTML=historyPage()}
function home(){
 let active=db.capitals.filter(c=>c.active!==false);
 let nio=active.filter(c=>c.currency==='NIO').reduce((s,c)=>s+totals(c.id).balance,0);
 let usd=active.filter(c=>c.currency==='USD').reduce((s,c)=>s+totals(c.id).balance,0);
 let count=active.length;
 return `<div class="welcome">Bienvenido</div>
 <div class="muted">Gestiona, controla y haz crecer tu capital.</div>
 <div class="hero">
   <div class="row"><div class="hero-label">CAPITAL DISPONIBLE</div><span class="tag">${count} ${count===1?'capital':'capitales'}</span></div>
   <div class="hero-value">${money(nio,'NIO')}</div>
   <div class="hero-sub">Córdobas</div>
   <div class="hero-divider"></div>
   <div class="hero-value hero-usd">${money(usd,'USD')}</div>
   <div class="hero-sub">Dólares</div>
   <div class="hero-note">Cada moneda se muestra por separado; no se convierten ni se mezclan.</div>
 </div>
 <div class="quickgrid">
   <button class="quick" onclick="document.getElementById('capitalList').scrollIntoView({behavior:'smooth'})"><div class="qicon">◉</div><strong>Capitales</strong><small>Crea y administra</small></button>
   <button class="quick" onclick="go('movements')"><div class="qicon">⇄</div><strong>Movimientos</strong><small>Registra ingresos y gastos</small></button>
   <button class="quick" onclick="go('reports')"><div class="qicon">▥</div><strong>Reportes</strong><small>Analiza tus resultados</small></button>
   <button class="quick" onclick="go('history')"><div class="qicon">◷</div><strong>Historial</strong><small>Consulta tu actividad</small></button>
 </div>
 <button class="home-create" onclick="newCapital()">＋ Crear nuevo capital</button>
 <div class="row" id="capitalList"><h2 style="margin-top:8px">Mis capitales</h2><span class="tag">${count} activos</span></div>
 ${active.length?active.map(c=>{let t=totals(c.id);return `<button class="capital" onclick="openCapital('${c.id}')"><div class="row"><strong>${esc(c.name)}</strong><span class="pill">${c.currency==='USD'?'DÓLARES':'CÓRDOBAS'}</span></div><div class="big">${money(t.balance,c.currency)}</div><div class="row small muted"><span>Gastado: ${money(t.spent,c.currency)}</span><span>Pendiente: ${money(t.pending,c.currency)}</span></div></button>`}).join(''):'<div class="card empty-state"><div class="empty-mark">＋</div><strong>Aún no tienes capitales registrados</strong><p>Crea tu primer capital para comenzar a controlar gastos, aportes y recuperaciones.</p><button class="secondary" onclick="newCapital()">Crear primer capital</button></div>'}
 <div class="notice">Tus datos se guardan localmente en este dispositivo. Conserva copias de seguridad desde Configuración.</div>`;
}
function openCapital(cid){selected=cid;tab='detail';renderDetail()}
function renderDetail(){let c=cap(selected);if(!c){go('home');return}let t=totals(c.id),es=validEvents(c.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));document.getElementById('view').innerHTML=`
 <button class="secondary" onclick="go('home')">← Mis capitales</button>
 <div class="card" style="margin-top:12px"><div class="row"><strong>${esc(c.name)}</strong><span class="pill">${c.currency}</span></div><div class="big">${money(t.balance,c.currency)}</div><div class="muted small">Saldo disponible</div><div class="grid" style="margin-top:14px">
 <div class="stat"><small>Capital inicial</small><strong>${money(t.initial,c.currency)}</strong></div><div class="stat"><small>Aportes adicionales</small><strong>${money(t.additions,c.currency)}</strong></div>
 <div class="stat"><small>Gastos definitivos</small><strong class="negative">${money(t.spent,c.currency)}</strong></div><div class="stat"><small>Dinero por recuperar</small><strong>${money(t.pending,c.currency)}</strong></div>
 <div class="stat"><small>Total recuperado</small><strong class="positive">${money(t.recovered,c.currency)}</strong></div><div class="stat"><small>Salidas recuperables</small><strong>${money(t.receivable,c.currency)}</strong></div></div>
 <div class="actions"><button class="primary" onclick="newMovement('expense','${c.id}')">＋ Gasto</button><button class="secondary" onclick="newMovement('recoverable','${c.id}')">↗ Por recuperar</button><button class="secondary" onclick="newMovement('addition','${c.id}')">＋ Aporte</button></div></div>
 <div class="row"><h2>Movimientos recientes</h2><button class="secondary" onclick="go('history')">Ver historial</button></div>
 ${es.slice(0,8).map(e=>movementRow(e,c)).join('')||'<div class="empty">Todavía no hay movimientos.</div>'}`;
}
function movementPage(){return `<h2>Registrar movimientos</h2>${db.capitals.length?db.capitals.map(c=>`<div class="card"><div class="row"><strong>${esc(c.name)}</strong><span class="pill">${c.currency}</span></div><div class="actions"><button class="primary" onclick="newMovement('expense','${c.id}')">Gasto definitivo</button><button class="secondary" onclick="newMovement('recoverable','${c.id}')">Dinero por recuperar</button><button class="secondary" onclick="newMovement('addition','${c.id}')">Aporte adicional</button><button class="secondary" onclick="recoveryPicker('${c.id}')">Registrar recuperación</button></div></div>`).join(''):'<div class="empty">Primero crea un capital.</div>'}`}
function movementRow(e,c){let type=e.type==='expense'?'Gasto definitivo':e.type==='recoverable'?'Por recuperar':e.type==='recovery'?'Recuperación':'Aporte adicional';let sign=e.type==='recovery'||e.type==='addition'?'+':'−';let cls=sign==='+'?'positive':'negative';return `<div class="movement"><div class="row"><div><strong>${esc(e.description||type)}</strong><div class="small muted">${fmtDate(e.date)} · ${type}${e.category?' · '+esc(e.category):''}</div></div><strong class="${cls}">${sign} ${money(e.amount,c.currency)}</strong></div>${e.type==='recoverable'?`<div class="small muted">Recuperado: ${money(recoveredFor(e.id),c.currency)} · Pendiente: ${money(Math.max(0,e.amount-recoveredFor(e.id)),c.currency)}</div>`:''}<div class="actions"><button class="secondary" onclick="editEvent('${e.id}')">Editar</button><button class="secondary" onclick="voidEvent('${e.id}')">Anular</button><button class="danger" onclick="deleteEvent('${e.id}')">Eliminar</button></div></div>`}
function recoveredFor(eid){return validEvents(capitalOfEvent(eid)).filter(e=>e.type==='recovery'&&e.parentId===eid).reduce((s,e)=>s+Number(e.amount),0)}
function capitalOfEvent(eid){return db.events.find(e=>e.id===eid)?.capitalId}
function historyPage(){let es=db.events.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));return `<div class="row"><h2 style="margin-top:4px">Historial completo</h2><span class="tag">${es.length} registros</span></div>${es.map(e=>{let c=cap(e.capitalId);return `<div class="movement"><div class="row"><strong>${esc(e.description||e.type)}</strong><span class="tag">${e.voided?'ANULADO':e.deleted?'ELIMINADO':e.type.toUpperCase()}</span></div><div class="small muted">${c?esc(c.name):'Capital eliminado'} · ${e.date||''} · ${c?money(e.amount,c.currency):e.amount}</div>${e.voided?'<div class="small warning">Anulado; conservado en auditoría.</div>':''}${e.deleted?'<div class="small negative">Eliminado del cálculo; registro de auditoría.</div>':''}</div>`}).join('')||'<div class="empty">Sin registros.</div>'}`}
function reportsPage(){let caps=db.capitals;if(!caps.length)return '<div class="empty">Crea un capital para ver reportes.</div>';return `<h2>Reportes</h2><div class="card"><label>Capital</label><select id="repCap" onchange="renderReportData()">${caps.map(c=>`<option value="${c.id}">${esc(c.name)} (${c.currency})</option>`).join('')}</select><div class="formgrid"><div><label>Mes</label><input type="month" id="repMonth" value="${reportMonth}" onchange="reportMonth=this.value;renderReportData()"></div><div><label>Año</label><input type="number" id="repYear" value="${reportYear}" min="2000" max="2100" onchange="reportYear=this.value;renderReportData()"></div></div></div><div id="reportData"></div>`}
function renderReportData(){let sel=document.getElementById('repCap');if(!sel)return;let c=cap(sel.value);if(!c)return;let es=validEvents(c.id),month=es.filter(e=>(e.date||'').slice(0,7)===reportMonth),year=es.filter(e=>(e.date||'').slice(0,4)===reportYear);let sum=(arr,type)=>arr.filter(e=>e.type===type).reduce((s,e)=>s+Number(e.amount),0);let t=totals(c.id);let cats={};month.filter(e=>e.type==='expense').forEach(e=>cats[e.category||'Sin categoría']=(cats[e.category||'Sin categoría']||0)+Number(e.amount));document.getElementById('reportData').innerHTML=`
 <div class="card"><h3>Resumen mensual · ${reportMonth}</h3><div class="grid"><div class="stat"><small>Gastos</small><strong>${money(sum(month,'expense'),c.currency)}</strong></div><div class="stat"><small>Salidas recuperables</small><strong>${money(sum(month,'recoverable'),c.currency)}</strong></div><div class="stat"><small>Recuperado</small><strong class="positive">${money(sum(month,'recovery'),c.currency)}</strong></div><div class="stat"><small>Aportes</small><strong>${money(sum(month,'addition'),c.currency)}</strong></div></div></div>
 <div class="card"><h3>Resumen anual · ${reportYear}</h3><div class="grid"><div class="stat"><small>Gastos definitivos</small><strong>${money(sum(year,'expense'),c.currency)}</strong></div><div class="stat"><small>Dinero recuperado</small><strong>${money(sum(year,'recovery'),c.currency)}</strong></div></div></div>
 <div class="card"><h3>Gastos por categoría · Mes</h3>${Object.keys(cats).length?Object.entries(cats).map(([k,v])=>`<div class="row movement"><span>${esc(k)}</span><strong>${money(v,c.currency)}</strong></div>`).join(''):'<div class="muted small">No hay gastos en este mes.</div>'}</div>
 <div class="card"><h3>Recuperaciones y pendientes</h3><div class="row movement"><span>Total por recuperar</span><strong>${money(t.receivable,c.currency)}</strong></div><div class="row movement"><span>Total recuperado</span><strong class="positive">${money(t.recovered,c.currency)}</strong></div><div class="row movement"><span>Pendiente</span><strong class="warning">${money(t.pending,c.currency)}</strong></div></div>
 <div class="card"><h3>Balance actual</h3><div class="big">${money(t.balance,c.currency)}</div><div class="small muted">Inicial ${money(t.initial,c.currency)} + aportes ${money(t.additions,c.currency)} − gastos ${money(t.spent,c.currency)} − salidas recuperables ${money(t.receivable,c.currency)} + recuperaciones ${money(t.recovered,c.currency)}</div></div>`}
function newCapital(){showModal(`<div class="sheethead"><h2>Crear nuevo capital</h2><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveCapital(event)"><label>Nombre del capital</label><input name="name" required maxlength="60" placeholder="Ej. Capital comercial"><label>Moneda</label><select name="currency"><option value="NIO">Córdobas (C$)</option><option value="USD">Dólares (USD)</option></select><label>Capital inicial</label><input name="initial" type="number" min="0" step="0.01" required placeholder="0.00"><label>Fecha de inicio</label><input name="date" type="date" value="${dateNow()}" required><div class="actions"><button class="primary" type="submit">Guardar capital</button><button class="secondary" type="button" onclick="closeModal()">Cancelar</button></div></form>`)}
function saveCapital(ev){ev.preventDefault();let f=new FormData(ev.target);let c={id:id(),name:f.get('name').trim(),currency:f.get('currency'),initial:Number(f.get('initial')),date:f.get('date'),active:true};db.capitals.push(c);save();closeModal();selected=c.id;render();openCapital(c.id)}
function newMovement(type,cid){let c=cap(cid);if(!c)return;let title=type==='expense'?'Gasto definitivo':type==='recoverable'?'Dinero por recuperar':'Aporte adicional';showModal(`<div class="sheethead"><h2>${title}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="notice">${esc(c.name)} · ${c.currency}. El movimiento se registrará únicamente en este capital.</div><form onsubmit="saveMovement(event,'${type}','${cid}')"><label>Descripción</label><input name="description" required maxlength="100" placeholder="¿En qué consiste?"><div class="formgrid"><div><label>Importe (${c.currency})</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Fecha</label><input name="date" type="date" value="${dateNow()}" required></div></div>${type==='expense'?`<label>Categoría</label><select name="category">${db.categories.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:''}<label>Observaciones (opcional)</label><textarea name="notes" placeholder="Detalles adicionales"></textarea><div class="actions"><button class="primary" type="submit">Guardar movimiento</button><button class="secondary" type="button" onclick="closeModal()">Cancelar</button></div></form>`)}
function saveMovement(ev,type,cid){ev.preventDefault();let f=new FormData(ev.target),amount=Number(f.get('amount'));if(!amount||amount<=0)return alert('Ingresa un importe válido.');db.events.push({id:id(),capitalId:cid,type,description:f.get('description').trim(),amount,date:f.get('date'),category:f.get('category')||'',notes:f.get('notes')||'',createdAt:new Date().toISOString()});save();closeModal();render();if(tab==='detail')renderDetail()}
function recoveryPicker(cid){let c=cap(cid),items=validEvents(cid).filter(e=>e.type==='recoverable'&&e.amount-recoveredFor(e.id)>.000001);showModal(`<div class="sheethead"><h2>Seleccionar recuperación</h2><button class="close" onclick="closeModal()">✕</button></div>${items.length?items.map(e=>`<button class="capital" onclick="newRecovery('${e.id}')"><strong>${esc(e.description)}</strong><div class="small muted">${fmtDate(e.date)} · Pendiente: ${money(e.amount-recoveredFor(e.id),c.currency)}</div></button>`).join(''):'<div class="empty">No hay saldos pendientes de recuperar.</div>'}`)}
function newRecovery(eid){let e=db.events.find(x=>x.id===eid),c=cap(e.capitalId),pending=e.amount-recoveredFor(eid);showModal(`<div class="sheethead"><h2>Registrar recuperación</h2><button class="close" onclick="closeModal()">✕</button></div><div class="notice">Movimiento original: ${esc(e.description)}<br>Pendiente: ${money(pending,c.currency)}</div><form onsubmit="saveRecovery(event,'${eid}')"><label>Importe recibido (${c.currency})</label><input name="amount" type="number" min="0.01" max="${pending.toFixed(2)}" step="0.01" required><label>Fecha de recepción</label><input name="date" type="date" value="${dateNow()}" required><label>Descripción / referencia</label><input name="description" maxlength="100" placeholder="Abono o devolución"><div class="actions"><button class="primary" type="submit">Guardar recuperación</button></div></form>`)}
function saveRecovery(ev,eid){ev.preventDefault();let f=new FormData(ev.target),orig=db.events.find(e=>e.id===eid),amt=Number(f.get('amount')),pending=orig.amount-recoveredFor(eid);if(amt<=0||amt>pending+.000001)return alert('El importe supera el saldo pendiente.');db.events.push({id:id(),capitalId:orig.capitalId,type:'recovery',parentId:eid,description:f.get('description').trim()||'Recuperación de '+orig.description,amount:amt,date:f.get('date'),createdAt:new Date().toISOString()});save();closeModal();render();if(tab==='detail')renderDetail()}
function editEvent(eid){let e=db.events.find(x=>x.id===eid);if(!e||e.type==='recovery')return alert('Por seguridad, los abonos se corrigen anulándolos y registrando uno nuevo.');let c=cap(e.capitalId);showModal(`<div class="sheethead"><h2>Editar movimiento</h2><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveEdit(event,'${eid}')"><label>Descripción</label><input name="description" value="${attr(e.description)}" required><div class="formgrid"><div><label>Importe (${c.currency})</label><input name="amount" type="number" min="0.01" step="0.01" value="${e.amount}" required></div><div><label>Fecha</label><input name="date" type="date" value="${e.date}" required></div></div>${e.type==='expense'?`<label>Categoría</label><select name="category">${db.categories.map(x=>`<option ${x===e.category?'selected':''}>${esc(x)}</option>`).join('')}</select>`:''}<label>Motivo de modificación</label><input name="reason" required placeholder="Explica el cambio"><div class="actions"><button class="primary" type="submit">Guardar cambios</button></div></form>`)}
function saveEdit(ev,eid){ev.preventDefault();let e=db.events.find(x=>x.id===eid),f=new FormData(ev.target);if(e.type==='recoverable'&&Number(f.get('amount'))<recoveredFor(eid))return alert('El nuevo importe no puede ser menor a lo ya recuperado.');e.audit=e.audit||[];e.audit.push({at:new Date().toISOString(),before:{description:e.description,amount:e.amount,date:e.date,category:e.category},reason:f.get('reason')});e.description=f.get('description').trim();e.amount=Number(f.get('amount'));e.date=f.get('date');e.category=f.get('category')||e.category;save();closeModal();render();if(tab==='detail')renderDetail()}
function voidEvent(eid){let e=db.events.find(x=>x.id===eid);if(!e)return;if(!confirm('¿Anular este movimiento? Se conservará en el historial y dejará de afectar los saldos.'))return;if(e.type==='recoverable'&&validEvents(e.capitalId).some(x=>x.type==='recovery'&&x.parentId===eid))return alert('Primero debes anular los abonos vinculados.');e.voided=true;e.voidedAt=new Date().toISOString();save();render();if(tab==='detail')renderDetail()}
function deleteEvent(eid){let e=db.events.find(x=>x.id===eid);if(!e)return;if(!confirm('¿Eliminar este movimiento? Esta acción se registrará en el historial y actualizará los cálculos.'))return;if(e.type==='recoverable'&&validEvents(e.capitalId).some(x=>x.type==='recovery'&&x.parentId===eid))return alert('Primero debes anular los abonos vinculados.');e.deleted=true;e.deletedAt=new Date().toISOString();save();render();if(tab==='detail')renderDetail()}
function openSettings(){showModal(`<div class="sheethead"><h2>Configuración</h2><button class="close" onclick="closeModal()">✕</button></div><div class="card"><h3>Categorías de gastos</h3><div class="small muted">Predeterminadas y personalizadas</div>${db.categories.map((x,i)=>`<div class="row movement"><span>${esc(x)}</span><button class="danger" onclick="removeCategory(${i})">Quitar</button></div>`).join('')}<form onsubmit="addCategory(event)"><label>Nueva categoría</label><input name="category" required maxlength="35" placeholder="Nombre de categoría"><div class="actions"><button class="primary">Agregar categoría</button></div></form></div><div class="card"><h3>Datos locales</h3><p class="small muted">La información se guarda en el almacenamiento de este navegador. Borrar los datos del navegador puede eliminar tus registros. Exporta periódicamente una copia de seguridad.</p><div class="actions"><button class="secondary" onclick="exportBackup()">Exportar copia JSON</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">Importar copia</button><input id="restoreFile" class="hidden" type="file" accept="application/json" onchange="importBackup(event)"></div></div>`)}
function addCategory(ev){ev.preventDefault();let f=new FormData(ev.target),v=f.get('category').trim();if(db.categories.some(x=>x.toLowerCase()===v.toLowerCase()))return alert('Esa categoría ya existe.');db.categories.push(v);save();openSettings()}
function removeCategory(i){if(!confirm('¿Quitar esta categoría de la lista? Los movimientos anteriores conservarán su categoría.'))return;db.categories.splice(i,1);save();openSettings()}
function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='control-capital-respaldo-'+dateNow()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(ev){let file=ev.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.capitals)||!Array.isArray(d.events)||!Array.isArray(d.categories))throw 0;if(!confirm('Importar reemplazará los datos actuales de este navegador. ¿Continuar?'))return;db=d;save();closeModal();go('home');alert('Copia restaurada.')}catch(e){alert('El archivo no parece ser una copia válida.')}};r.readAsText(file)}
function showModal(s){document.getElementById('sheet').innerHTML=s;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(s){return esc(s).replace(/`/g,'&#96;')}
render();
</script>
</body></html>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script>
